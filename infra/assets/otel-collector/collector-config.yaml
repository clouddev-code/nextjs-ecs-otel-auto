extensions:
  health_check:
  # Signs prometheusremotewrite requests with SigV4 -- AMP's remote write endpoint requires
  # IAM auth, unlike awsxray which authenticates via the AWS SDK's default credential chain.
  sigv4auth:
    region: "__AWS_REGION__"
    service: "aps"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Must run first in the pipeline: sheds load before other processors buffer data,
  # protecting the collector container from OOM-kill under the ECS hard memory limit.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 40
  resourcedetection:
    detectors: [env, system, ecs]
  # Must run before batch/traces: batching mixes spans from different traces into one
  # request, which breaks tail_sampling's per-trace decision buffering.
  tail_sampling:
    decision_wait: 5s
    num_traces: 5000
    expected_new_traces_per_sec: 20
    policies:
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces-policy
        type: latency
        latency:
          threshold_ms: 500
      - name: baseline-probabilistic-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch/traces:
    timeout: 1s
    send_batch_size: 50
  batch/metrics:
    timeout: 60s
    send_batch_size: 200

exporters:
  awsxray:
  prometheusremotewrite:
    endpoint: "__AMP_REMOTE_WRITE_ENDPOINT__"
    auth:
      authenticator: sigv4auth

service:
  extensions: [health_check, sigv4auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, tail_sampling, batch/traces]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch/metrics]
      exporters: [prometheusremotewrite]
